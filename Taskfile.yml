version: '3'

# Tasks needed to work on the dx repository itself.
# Shared tasks consumed by other repositories live in
# .devcontainer/src/dx/runtime/taskfiles/ and are included via Remote Taskfiles.

tasks:
  default:
    desc: Show available tasks.
    cmds:
      - task --list

  validate:
    desc: Repository sanity check (required files, JSON/workflow syntax, executable bits).
    cmds:
      - |
        for file in \
          .devcontainer/src/dx/install.sh \
          .devcontainer/src/dx/runtime/bin/dx-mcp; do
          entry=$(git ls-files --stage --error-unmatch "$file") || {
            echo "required file is not tracked: $file" >&2
            exit 1
          }
          mode=${entry%% *}
          if [ "$mode" != "100755" ]; then
            echo "not executable in git: $file" >&2
            exit 1
          fi
        done
      - test -f .devcontainer/src/dx/devcontainer-feature.json
      - test -f default.json
      - test -f renovate.json
      - test -f .devcontainer/devcontainer.json
      - test -f .github/workflows/validate.yml
      - test -f .github/workflows/maintenance.yml
      - test -f .github/workflows/reusable-validate.yml
      - test -f .github/workflows/reusable-maintenance.yml
      - test -f .github/workflows/release.yml
      - bash .devcontainer/test/dx/validate-json.sh
      - bash .devcontainer/test/dx/validate-workflows.sh
      - task --taskfile Taskfile.yml --list >/dev/null
      - task --taskfile .devcontainer/src/dx/runtime/taskfiles/base.yml --list >/dev/null

  test:
    desc: Run the dx test suite (non-Feature tests; see feature:test for the Feature).
    cmds:
      - test -x .devcontainer/src/dx/runtime/bin/dx-mcp
      - bash -n .devcontainer/src/dx/runtime/bin/dx-mcp
      - bash -n .devcontainer/test/dx/test-dx-mcp-resolution.sh
      - bash -n .devcontainer/test/dx/test-dx-mcp-image.sh
      - node -e "const d=require('./examples/consumer/.devcontainer/devcontainer.json'); if (!d.features['ghcr.io/devcontainers/features/docker-outside-of-docker:1']) process.exit(1)"
      - node -e "const d=require('./examples/consumer/.devcontainer/devcontainer.json'); if (d.features['ghcr.io/devcontainers-extra/features/go-task:1'].version !== '3.53.1') process.exit(1)"
      - "grep -q 'TASK_REMOTE_TRUSTED_HOSTS: github.com' .github/workflows/reusable-validate.yml"
      - "grep -q 'version: 3.53.1' .github/workflows/reusable-validate.yml"
      - grep -q 'ref=v1.0.0' examples/consumer/Taskfile.yml
      - "! rg -n 'ghcr.io/gildraen/dx/dx:1($|[^.])' README.md docs examples/consumer"
      - rg -n 'ghcr.io/gildraen/dx/dx:1\.0\.0' README.md docs examples/consumer
      - '! rg -n "@modelcontextprotocol/server-github|MCP_DATA_DIR|mcp-server-github" src .devcontainer examples/consumer'
      - bash .devcontainer/test/dx/test-dx-mcp-image.sh

  feature:test:
    desc: Run the Dev Container Feature test suite (requires a Docker daemon reachable with matching bind-mount paths, e.g. not always available from nested docker-outside-of-docker).
    cmds:
      - npx --yes @devcontainers/cli features test --features dx --project-folder .devcontainer

  status:
    desc: Show basic repository state.
    cmds:
      - |
        echo "=== dx status ==="
        echo "Git: $(git log --oneline -1 2>/dev/null || echo 'no commits yet')"
        changed=$(git status --short 2>/dev/null | wc -l | tr -d ' ')
        if [ "$changed" -eq 0 ]; then
          echo "     working tree clean"
        else
          echo "     $changed file(s) modified"
        fi

  archive:
    desc: Create a shareable archive of the tracked (git) files only.
    cmds:
      - |
        repo_name=$(basename "$PWD")
        timestamp=$(date -u +%Y%m%d-%H%M%S)
        archive_dir="artifacts"
        archive_path="$archive_dir/${repo_name}-${timestamp}.zip"

        mkdir -p "$archive_dir"
        git archive --format=zip --output="$archive_path" HEAD
        echo "Archive created: $archive_path (tracked files only, via git archive)"
