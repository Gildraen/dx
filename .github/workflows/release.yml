name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-feature:
    name: Publish DX Dev Container Feature
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches Feature version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_from_tag="${RELEASE_TAG#v}"
          version_from_manifest="$(node -p "require('./.devcontainer/src/dx/devcontainer-feature.json').version")"
          if [ "$version_from_tag" != "$version_from_manifest" ]; then
            echo "Release tag $RELEASE_TAG does not match Feature version $version_from_manifest" >&2
            exit 1
          fi

      - name: Publish Features to GHCR
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-feature
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
