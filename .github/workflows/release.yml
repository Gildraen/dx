name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate.yml
    secrets: inherit

  devcontainer-test:
    uses: ./.github/workflows/reusable-devcontainer-test.yml
    secrets: inherit

  feature-test:
    uses: ./.github/workflows/reusable-feature-test.yml
    secrets: inherit

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [validate, devcontainer-test, feature-test]
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@1a4442caab129478691007521f1e7dda0c5c4d54 # v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  publish-feature:
    name: Publish DX Dev Container Feature
    runs-on: ubuntu-latest
    needs: semantic-release
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    if: needs.semantic-release.outputs.new-release-published == 'true' || success()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish Features to GHCR
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
