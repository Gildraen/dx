name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-feature:
    name: Publish DX Dev Container Feature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish Feature with the native action
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"
          disable-repo-tagging: "true"
          devcontainer-cli-version: "0.88.0"
        env:
          GITHUB_TOKEN: ${{ github.token }}
