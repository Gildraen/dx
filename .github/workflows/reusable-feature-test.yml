    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Feature tests on the GitHub runner
        run: bash .devcontainer/test/dx/feature-test.sh