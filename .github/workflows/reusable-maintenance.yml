name: reusable-maintenance

on:
  workflow_call:
    inputs:
      link-check-paths:
        description: Glob patterns (space-separated) of files to check for broken links.
        type: string
        default: "docs/**/*.md README.md AGENTS.md"
      link-check-excludes:
        description: Extra lychee --exclude patterns (space-separated).
        type: string
        default: ""

jobs:
  check-links:
    name: Check docs links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >
            --no-progress
            --exclude-loopback
            ${{ inputs.link-check-excludes }}
            ${{ inputs.link-check-paths }}
          fail: true
