name: reusable-maintenance

on:
  workflow_call:
    inputs:
      link-check-paths:
        description: Glob patterns (space-separated) of files to check for broken links.
        type: string
        default: "docs/**/*.md README.md AGENTS.md"
      link-check-excludes:
        description: Extra lychee --exclude patterns (space-separated).
        type: string
        default: ""

jobs:
  check-links:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-maintenance.yml@b8cc1c66c153e49887f0c63baa4a1aa238998b10 # v0.1.0-rc.1
    with:
      link-check-paths: ${{ inputs.link-check-paths }}
      link-check-excludes: ${{ inputs.link-check-excludes }}
    secrets: inherit
