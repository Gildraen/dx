name: validate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@62f1721ea92ffd7275f4e4e2c60727b486d7def1 # v0.1.0

  test:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-devcontainer-test.yml@62f1721ea92ffd7275f4e4e2c60727b486d7def1 # v0.1.0

  feature-test:
    uses: ./.github/workflows/reusable-feature-test.yml

  feature-manifest:
    name: Validate Feature manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same schema check the publish step runs, so a bad manifest fails before Feature publication.
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"

  release:
    name: Open or update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test, feature-test, feature-manifest]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Gildraen/ci-workflows/.github/workflows/reusable-release-please.yml@4b4026ff669b5fe8da2aa83e216591bb09e1e8a1 # 0.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      target-branch: main
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
