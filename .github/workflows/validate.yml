name: validate

on:
  pull_request:
    paths-ignore:
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate.yml
    secrets: inherit

  test:
    uses: ./.github/workflows/reusable-devcontainer-test.yml
    secrets: inherit

  feature-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Feature tests on the GitHub runner
        run: npx --yes @devcontainers/cli@0.88.0 features test --features dx --project-folder .devcontainer
