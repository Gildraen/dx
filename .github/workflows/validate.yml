name: validate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@v0.1.0-rc.1
    secrets: inherit

  test:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-devcontainer-test.yml@v0.1.0-rc.1
    secrets: inherit

  feature-test:
    uses: ./.github/workflows/reusable-feature-test.yml
    secrets: inherit

  feature-manifest:
    name: Validate Feature manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Same schema check the publish step runs, so a bad manifest fails before Feature publication.
      - uses: devcontainers/action@v1.4.3
        with:
          validate-only: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"
