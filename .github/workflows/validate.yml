name: validate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0

  test:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-devcontainer-test.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0

  feature-test:
    uses: ./.github/workflows/reusable-feature-test.yml

  feature-manifest:
    name: Validate Feature manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same schema check the publish step runs, so a bad manifest fails before Feature publication.
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./.devcontainer/src"
          generate-docs: "false"
