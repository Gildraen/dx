name: reusable-validate

on:
  workflow_call:
    inputs:
      task-name:
        description: Task to run for the "validate" contract.
        type: string
        default: validate

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@62f1721ea92ffd7275f4e4e2c60727b486d7def1 # v0.1.0
    with:
      task-name: ${{ inputs.task-name }}
