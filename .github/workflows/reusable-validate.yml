name: reusable-validate

on:
  workflow_call:
    inputs:
      task-name:
        description: Task to run for the "validate" contract.
        type: string
        default: validate

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@v0.1.0-rc.1
    with:
      task-name: ${{ inputs.task-name }}
    secrets: inherit
