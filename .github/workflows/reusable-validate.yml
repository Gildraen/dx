name: reusable-validate

on:
  workflow_call:
    inputs:
      task-name:
        description: Task to run for the "validate" contract.
        type: string
        default: validate

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@eabb9d61ea2a827476f46e7e3e9577d956d8f470 # 0.2.0
    with:
      task-name: ${{ inputs.task-name }}
