name: reusable-validate

on:
  workflow_call:
    inputs:
      task-name:
        description: Task to run for the "validate" contract.
        type: string
        default: validate

jobs:
  validate:
    uses: Gildraen/ci-workflows/.github/workflows/reusable-validate.yml@ee36dca8e6a5b2c40a652fcd438e4e6451c9e108
    with:
      task-name: ${{ inputs.task-name }}
    secrets: inherit
