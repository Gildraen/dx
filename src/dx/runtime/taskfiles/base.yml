version: '3'

# Shared DX helper tasks. Include from a consumer Taskfile via a versioned
# remote reference, e.g.:
#
#   includes:
#     dx: https://github.com/Gildraen/dx.git//src/dx/runtime/taskfiles/base.yml?ref=v1.0.0
#
# These tasks are generic DX helpers, not project contracts. Project contracts
# (validate/test/lint) stay defined in each consumer's own Taskfile.

tasks:
  doctor:
    desc: Print the resolved DX_HOME and whether the runtime is present.
    cmds:
      - |
        dx_home="${DX_HOME:-}"
        if [ -z "$dx_home" ]; then
          if [ -d "$PWD/.dx/src/dx/runtime" ]; then
            dx_home="$PWD/.dx/src/dx/runtime"
          else
            dx_home="/opt/dx"
          fi
        fi
        echo "DX_HOME=$dx_home"
        if [ -d "$dx_home" ]; then
          echo "runtime: found"
        else
          echo "runtime: NOT found" >&2
          exit 1
        fi

  mcp:github:
    desc: Run the official GitHub MCP server through the DX launcher.
    cmds:
      - dx-mcp github {{.CLI_ARGS}}
